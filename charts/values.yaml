image:
  repository: europe-north1-docker.pkg.dev/nais-io/nais/images/smsmanager
  tag: "latest"

naisvakt:
  smsAlertsEnabled: true

smsHost: "n-eu.linkmobility.io"

extraEnv: {}
podSecurityContext: {}

securityContext:
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
